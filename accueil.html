<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN - Apprendre l'Hébreu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f0f8ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
        }

        .logo-section img {
            max-width: 100%;
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            border-radius: 8px;
        }

        /* Boutons */
        .buttons-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .button-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px;
            background: linear-gradient(135deg, #B3E5FC 0%, #E1F5FE 100%);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .button-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            background: linear-gradient(135deg, #81D4FA 0%, #B3E5FC 100%);
        }

        .button-card:active {
            transform: translateY(-2px);
        }

        .icon-wrapper {
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .icon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .content-wrapper h2 {
            color: #01579B;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .content-wrapper p {
            color: #0277BD;
            font-size: 14px;
            font-weight: 500;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .logo-section {
                margin-bottom: 40px;
            }

            .button-card {
                padding: 20px;
                gap: 15px;
            }

            .icon-wrapper {
                width: 60px;
                height: 60px;
                font-size: 35px;
            }

            .content-wrapper h2 {
                font-size: 18px;
            }

            .content-wrapper p {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="logo-mizoulpan.jpg" alt="MIZOULPAN Logo">
        </div>

        <!-- Buttons Section -->
        <div class="buttons-section">
            <!-- Quizz Button -->
            <a href="index.html" class="button-card">
                <div class="icon-wrapper">
                    <img src="icon-quizz.jpg" alt="Quizz" class="icon-image">
                </div>
                <div class="content-wrapper">
                    <h2>Quizz</h2>
                    <p>Testez vos connaissances</p>
                </div>
            </a>

            <!-- Exercices Button -->
            <a href="exercices.html" class="button-card">
                <div class="icon-wrapper">
                    <img src="icon-exercices.jpg" alt="Exercices" class="icon-image">
                </div>
                <div class="content-wrapper">
                    <h2>Exercices</h2>
                    <p>Pratiquez avec des exercices</p>
                </div>
            </a>

            <!-- Vocabulaire Button -->
            <a href="vocabulaire.html" class="button-card">
                <div class="icon-wrapper">
                    <img src="icon-vocabulaire.jpg" alt="Vocabulaire" class="icon-image">
                </div>
                <div class="content-wrapper">
                    <h2>Vocabulaire</h2>
                    <p>Apprenez de nouveaux mots</p>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Gestion des clics avec feedback
        document.querySelectorAll('.button-card').forEach(button => {
            button.addEventListener('click', function(e) {
                // Ripple effect (optionnel)
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
            });
        });
    </script>
</body>
</html>
