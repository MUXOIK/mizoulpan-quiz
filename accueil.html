<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN - Apprendre l'Hébreu</title>
    <link rel="stylesheet" href="style-global.css">
    <style>
        /* SPÉCIFIQUE À L'ACCUEIL */
        .logo-bandeau {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .logo-bandeau img {
            max-width: 100%;
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            border-radius: 8px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .main-title h2 {
            color: var(--primary-blue);
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .main-subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* ✅ OPTIMISÉ MOBILE */
        @media (max-width: 768px) {
            .main-title h2 {
                font-size: 1.6rem;
                margin-bottom: 8px;
            }

            .main-subtitle {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .main-title h2 {
                font-size: 1.4rem;
            }

            .main-subtitle {
                font-size: 0.8rem;
            }
        }

        /* GRILLE DE CARTES */
        .buttons-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .button-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px;
            background: linear-gradient(135deg, #B3E5FC 0%, #E1F5FE 100%);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .button-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            background: linear-gradient(135deg, #81D4FA 0%, #B3E5FC 100%);
        }

        .button-card:active {
            transform: translateY(-2px);
        }

        .icon-wrapper {
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .content-wrapper h3 {
            color: #01579B;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .content-wrapper p {
            color: #0277BD;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* ✅ OPTIMISÉ MOBILE */
        @media (max-width: 768px) {
            .button-card {
                padding: 18px;
                gap: 12px;
            }

            .icon-wrapper {
                width: 55px;
                height: 55px;
            }

            .content-wrapper h3 {
                font-size: 1rem;
            }

            .content-wrapper p {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .button-card {
                padding: 16px;
                gap: 12px;
            }

            .icon-wrapper {
                width: 50px;
                height: 50px;
            }

            .content-wrapper h3 {
                font-size: 0.95rem;
            }

            .content-wrapper p {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- PAGE HEADER AVEC DRAPEAUX ET BULLE INTÉGRÉE -->
            <div class="page-header" style="padding: 12px; margin-bottom: 16px; position: relative;">
                <div class="title-zone">
                    <img src="israel.png" alt="Israël" class="flag-icon" style="width: 35px; height: 23px;">
                    <h1 style="margin: 0; font-size: 1.6rem;">MIZOULPAN</h1>
                    <img src="france.png" alt="France" class="flag-icon" style="width: 35px; height: 23px;">
                </div>
                <p style="text-align: center; margin: 6px 0 0; font-size: 0.9rem; color: var(--primary-blue); font-weight: 500;">Apprendre l'hébreu moderne</p>
                <!-- BULLE EN HAUT À DROITE DU CADRE BLEU -->
                <img src="logo-mizoulpan.png" alt="MIZOULPAN" style="height: 50px; width: 50px; position: absolute; top: 8px; right: 12px;">
            </div>

            <!-- CARTES DE NAVIGATION -->
            <div class="buttons-section">
                <!-- Quiz -->
                <a href="index.html" class="button-card">
                    <div class="icon-wrapper">
                        <img src="icon-quizz.jpg" alt="Quiz" class="icon-image">
                    </div>
                    <div class="content-wrapper">
                        <h3>Quiz</h3>
                        <p>Testez vos connaissances</p>
                    </div>
                </a>

                <!-- Exercices -->
                <a href="exercices.html" class="button-card">
                    <div class="icon-wrapper">
                        <img src="icon-exercices.jpg" alt="Exercices" class="icon-image">
                    </div>
                    <div class="content-wrapper">
                        <h3>Exercices</h3>
                        <p>Pratiquez avec des exercices</p>
                    </div>
                </a>

                <!-- Vocabulaire -->
                <a href="dico.html" class="button-card">
                    <div class="icon-wrapper">
                        <img src="icon-vocabulaire.jpg" alt="Vocabulaire" class="icon-image">
                    </div>
                    <div class="content-wrapper">
                        <h3>Vocabulaire</h3>
                        <p>Apprenez de nouveaux mots</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        console.log('MIZOULPAN Accueil chargé');
    </script>
</body>
</html>
