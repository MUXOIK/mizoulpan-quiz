<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN - Exercices</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .screen {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: none;
            animation: fadeIn 0.3s;
        }
        .screen.active { display: flex; flex-direction: column; justify-content: center; min-height: 600px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h1 { color: #0038B8; text-align: center; margin-bottom: 10px; font-size: 36px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 25px;
            border: 2px solid #0038B8;
            border-radius: 12px;
            background: white;
            color: #0038B8;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #0038B8; color: white; transform: translateY(-2px); }
        button.selected { background: #0038B8; color: white; }
        
        .phrase-box {
            background: #F5F5F5;
            border-left: 4px solid #0038B8;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            direction: rtl;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .icon-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #0038B8;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .icon-button:hover { background: #002D7A; transform: scale(1.1); }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #DDD;
            border-radius: 8px;
            margin: 15px 0;
        }
        input[type="text"]:focus { outline: none; border-color: #0038B8; }
        
        .validate-button {
            width: 100%;
            background: #0038B8;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .validate-button:hover { background: #002D7A; }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-modify { background: #FFC107; color: #333; }
        .btn-modify:hover { background: #FFB300; }
        .btn-next { background: #0038B8; color: white; }
        .btn-next:hover { background: #002D7A; }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #DDD;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: #0038B8; transition: width 0.3s; }
        
        .stats { text-align: center; margin-top: 20px; }
        .stat-line { font-size: 18px; margin: 10px 0; color: #333; }
        
        .final-score { font-size: 48px; color: #0038B8; font-weight: bold; text-align: center; margin: 20px 0; }
        
        .back-button { width: 100%; background: #999; color: white; margin-top: 20px; }
        .back-button:hover { background: #777; }
        
        .reveal-box {
            background: #E8F5E9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
            display: none;
        }
        .reveal-box.show { display: block; }
        .reveal-label { font-size: 14px; color: #2E7D32; font-weight: bold; margin-bottom: 10px; }
        .reveal-content { font-size: 20px; font-weight: bold; color: #1B5E20; }
        
        .loading-text {
            text-align: center;
            color: #0038B8;
            font-size: 18px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ÉCRAN 1: CONFIGURATION -->
    <div class="screen active" id="screen1">
        <h1>🇮🇱 MIZOULPAN - Exercices</h1>
        <p class="subtitle">Phrases générées par IA avec accords corrects</p>
        
        <div style="color: #0038B8; font-size: 16px; margin-top: 30px; margin-bottom: 30px;">
            <div class="section-title" style="margin-top: 0;">Choisis le SENS de traduction:</div>
            <div class="button-grid">
                <button onclick="selectSens('fr-he')" class="selected">🇫🇷 → 🇮🇱<br>Français → Hébreu</button>
                <button onclick="selectSens('he-fr')">🇮🇱 → 🇫🇷<br>Hébreu → Français</button>
            </div>
        </div>
        
        <button onclick="startExercises()" style="width: 100%; background: #0038B8; color: white; padding: 15px;">
            → Commencer les exercices
        </button>
        <div class="loading-text" id="loadingStatus"></div>
    </div>

    <!-- ÉCRAN 2: EXERCICE -->
    <div class="screen" id="screen2">
        <h1>Phrase <span id="phraseNumber">1</span> / 20</h1>
        <p class="subtitle">Traduis cette phrase:</p>
        
        <div class="phrase-box" id="phraseDisplay"></div>
        
        <div class="controls">
            <button class="icon-button" onclick="speakPhrase()" title="Écouter">🔊</button>
            <button class="icon-button" id="micButton" onclick="toggleMicrophone()" title="Parler">🎤</button>
        </div>
        
        <input type="text" id="answerInput" placeholder="Tape ta traduction ici...">
        <button class="validate-button" onclick="validateAnswer()">✓ Valider la réponse</button>
        
        <div class="reveal-box" id="revealBox">
            <div class="reveal-label" id="revealLabel"></div>
            <div class="reveal-content" id="revealContent"></div>
        </div>
        
        <div class="button-group" id="navigationButtons" style="display: none;">
            <button class="btn-modify" onclick="modifyAnswer()">← Modifier ma réponse</button>
            <button class="btn-next" onclick="nextPhrase()">Phrase suivante →</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="stats">
            <div class="stat-line">📊 Progression: <span id="progressText">0/20</span></div>
            <div class="stat-line">⭐ Score: <span id="scoreText">0</span></div>
        </div>
        
        <button class="back-button" onclick="goBack()">← Retour</button>
    </div>

    <!-- ÉCRAN 3: RÉSUMÉ -->
    <div class="screen" id="screen3">
        <h1>🎉 Bravo!</h1>
        <p class="subtitle">Tu as terminé les exercices</p>
        
        <div class="final-score"><span id="finalScore">0</span>/20</div>
        
        <div class="stats">
            <div class="stat-line">✅ Bonnes réponses: <span id="correctCount">0</span></div>
            <div class="stat-line">❌ À revoir: <span id="wrongCount">0</span></div>
        </div>
        
        <button class="validate-button" onclick="restartExercises()" style="margin-top: 30px;">← Recommencer</button>
    </div>
</div>

<script>
const GITHUB_URL = 'https://raw.githubusercontent.com/MUXOIK/mizoulpan-quiz/main/vocabulaire.xlsx';
const CLAUDE_API = 'https://api.anthropic.com/v1/messages';

let generatedPhrases = [];
let currentPhraseIndex = 0;
let answers = [];
let state = { sens: 'fr-he' };
let answerValidated = false;

const $ = id => document.getElementById(id);

function selectSens(sens) {
    state.sens = sens;
    document.querySelectorAll('.button-grid button').forEach((b, i) => {
        b.classList.toggle('selected', (i === 0 && sens === 'fr-he') || (i === 1 && sens === 'he-fr'));
    });
}

// Charger l'Excel COMPLET avec TOUS les détails
async function loadCompleteExcel() {
    try {
        const response = await fetch(GITHUB_URL + '?t=' + Date.now());
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        
        // Créer un résumé complet du dictionnaire avec TOUTES les colonnes
        let dictionaryText = "ANALYSE COMPLÈTE DU DICTIONNAIRE:\n\n";
        
        for (const sheetName of workbook.SheetNames) {
            const sheet = workbook.Sheets[sheetName];
            const rawData = XLSX.utils.sheet_to_json(sheet);
            
            dictionaryText += `\n📚 ONGLET: ${sheetName.toUpperCase()}\n`;
            dictionaryText += "Colonnes: " + Object.keys(rawData[0] || {}).join(", ") + "\n";
            dictionaryText += "Exemples:\n";
            
            rawData.slice(0, 10).forEach(row => {
                dictionaryText += `  - FR: "${row.francais}" | HE: "${row.hebreu}" | FORME: "${row.forme || 'N/A'}"\n`;
            });
        }
        
        return dictionaryText;
    } catch (error) {
        console.error('❌ Erreur:', error);
        return null;
    }
}

// Demander à Claude de GÉNÉRER et VÉRIFIER les phrases
async function generatePhrasesWithAI(dictionaryText) {
    const prompt = `Tu es un expert en linguistique français-hébreu et en pédagogie.

Tu as accès à ce dictionnaire complet avec différentes formes grammaticales:

${dictionaryText}

**TA MISSION:**
1. **ANALYSE** ce dictionnaire pour comprendre:
   - Les verbes avec leurs formes conjuguées (je, tu, il, nous, vous, ils)
   - Les noms avec leurs genres et nombres
   - Les adjectifs avec leurs formes (masc/fem, sing/plur)
   - Les adverbes

2. **GÉNÈRE 20 PHRASES** en français qui:
   - Utilisent UNIQUEMENT les mots de ce dictionnaire
   - Respectent les ACCORDS grammaticaux CORRECTS:
     * Sujet-verbe: Si "je" → verbe conjugué pour "je"
     * Genre-adjectif: Si nom féminin → adjectif féminin
     * Nombre: singulier ou pluriel accordé
   - Varient les sujets (je, tu, il, nous, vous, ils)
   - Varient les longueurs (3 mots, 5 mots, 8 mots)

3. **VÉRIFIE TIEN-MÊME** que:
   - Chaque phrase a du SENS SÉMANTIQUE
   - Chaque phrase est GRAMMATICALEMENT CORRECTE
   - Les ACCORDS sont PARFAITS
   - Si une phrase est douteuse, CORRIGE-LA ou SUPPRIME-LA

4. **RETOURNE UNIQUEMENT** des phrases 100% correctes

**FORMAT DE RÉPONSE:**
Réponds UNIQUEMENT avec un JSON valide (pas d'explications):
[
  {"fr": "Je mange une pomme rouge", "he": "אני אוכל תפוח אדום"},
  {"fr": "Tu portes une belle chemise bleue", "he": "אתה לובש חולצה כחולה יפה"},
  ...
]`;

    $('loadingStatus').textContent = '⏳ Claude analyse le dictionnaire et génère les phrases...';
    
    try {
        const response = await fetch(CLAUDE_API, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 3000,
                messages: [
                    { role: 'user', content: prompt }
                ]
            })
        });
        
        if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
        }
        
        const data = await response.json();
        const responseText = data.content[0].text;
        
        // Parser le JSON
        const jsonMatch = responseText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
            throw new Error('Pas de JSON trouvé');
        }
        
        const phrases = JSON.parse(jsonMatch[0]);
        generatedPhrases = phrases.slice(0, 20);
        
        console.log('✅ Phrases générées et vérifiées:', generatedPhrases.length);
        return true;
        
    } catch (error) {
        console.error('❌ Erreur:', error);
        $('loadingStatus').textContent = '❌ Erreur: ' + error.message;
        return false;
    }
}

async function startExercises() {
    $('loadingStatus').textContent = '⏳ Chargement du dictionnaire Excel...';
    
    const dictionaryText = await loadCompleteExcel();
    if (!dictionaryText) {
        $('loadingStatus').textContent = '❌ Erreur de chargement';
        return;
    }
    
    const success = await generatePhrasesWithAI(dictionaryText);
    if (!success || generatedPhrases.length === 0) {
        $('loadingStatus').textContent = '❌ Impossible de générer les phrases';
        return;
    }
    
    answers = Array(generatedPhrases.length).fill(null);
    currentPhraseIndex = 0;
    displayPhrase();
    switchScreen('screen2');
}

function displayPhrase() {
    answerValidated = false;
    const phrase = generatedPhrases[currentPhraseIndex];
    const displayText = state.sens === 'fr-he' ? phrase.fr : phrase.he;
    
    $('phraseDisplay').textContent = displayText;
    $('phraseNumber').textContent = currentPhraseIndex + 1;
    $('answerInput').value = '';
    $('revealBox').classList.remove('show');
    $('navigationButtons').style.display = 'none';
    $('progressText').textContent = `${currentPhraseIndex}/20`;
    $('progressFill').style.width = (currentPhraseIndex / 20 * 100) + '%';
    
    const correct = answers.filter(a => a && a.correct).length;
    $('scoreText').textContent = correct;
}

function speakPhrase() {
    const phrase = generatedPhrases[currentPhraseIndex];
    const textToSpeak = state.sens === 'fr-he' ? phrase.fr : phrase.he;
    
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = state.sens === 'fr-he' ? 'fr-FR' : 'he-IL';
    speechSynthesis.speak(utterance);
}

function toggleMicrophone() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
    
    const btn = $('micButton');
    btn.style.background = '#F44336';
    
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        $('answerInput').value = transcript;
        btn.style.background = '#0038B8';
    };
    
    recognition.onerror = () => {
        btn.style.background = '#0038B8';
    };
    
    recognition.start();
}

function validateAnswer() {
    if (answerValidated) return;
    answerValidated = true;
    
    const userAnswer = $('answerInput').value.trim();
    const phrase = generatedPhrases[currentPhraseIndex];
    const correctAnswer = state.sens === 'fr-he' ? phrase.he : phrase.fr;
    
    const isCorrect = userAnswer.toLowerCase().replace(/\s+/g, ' ') === 
                     correctAnswer.toLowerCase().replace(/\s+/g, ' ');
    
    answers[currentPhraseIndex] = { correct: isCorrect, user: userAnswer };
    
    if (isCorrect) {
        $('revealLabel').textContent = '✓ Bonne réponse!';
        $('revealLabel').style.color = '#2E7D32';
    } else {
        $('revealLabel').textContent = 'La bonne réponse est:';
        $('revealLabel').style.color = '#C62828';
    }
    
    $('revealContent').textContent = correctAnswer;
    $('revealBox').classList.add('show');
    $('navigationButtons').style.display = 'flex';
}

function modifyAnswer() {
    answerValidated = false;
    $('answerInput').focus();
    $('revealBox').classList.remove('show');
    $('navigationButtons').style.display = 'none';
}

function nextPhrase() {
    currentPhraseIndex++;
    if (currentPhraseIndex < generatedPhrases.length) {
        displayPhrase();
    } else {
        showSummary();
    }
}

function showSummary() {
    const correct = answers.filter(a => a && a.correct).length;
    $('finalScore').textContent = correct;
    $('correctCount').textContent = correct;
    $('wrongCount').textContent = generatedPhrases.length - correct;
    switchScreen('screen3');
}

function restartExercises() {
    switchScreen('screen1');
}

function goBack() {
    switchScreen('screen1');
}

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(screenId).classList.add('active');
}
</script>
</body>
</html>
