<!DOCTYPE html>
<!-- VERSION: 2.1 - BOUTONS FIXES -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN Exercices</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Heebo, sans-serif; background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { color: #0038B8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .section { margin-bottom: 20px; }
        .label { font-size: 12px; color: #0038B8; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .btn { padding: 12px 20px; border: 2px solid #0038B8; background: white; color: #0038B8; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn.active { background: #0038B8; color: white; }
        .start-btn { width: 100%; padding: 16px; background: #0038B8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
        .start-btn:hover { background: #002D7A; }
        .loading { text-align: center; color: #0038B8; margin-top: 20px; }
        .setup-screen { display: none; }
        .setup-screen.active { display: block; }
        .exercise-screen { display: none; }
        .exercise-screen.active { display: block; }
        .back-btn { background: none; border: none; color: #0038B8; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .progress { width: 100%; height: 6px; background: #DDD; border-radius: 3px; margin: 15px 0; }
        .progress-bar { height: 100%; background: #0038B8; border-radius: 3px; }
        .question { font-size: 26px; text-align: center; background: #F5F5F5; padding: 25px; border-radius: 10px; margin: 20px 0; direction: rtl; }
        .audio-buttons { display: flex; gap: 15px; justify-content: center; margin: 15px 0; }
        .audio-btn { background: none; border: none; font-size: 32px; cursor: pointer; padding: 10px; transition: all 0.2s; }
        .audio-btn:hover { transform: scale(1.3); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .input-box { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #DDD; border-radius: 8px; margin: 15px 0; }
        .input-box:focus { outline: none; border-color: #0038B8; }
        .buttons { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
        @media (max-width: 768px) { .buttons { grid-template-columns: 1fr 1fr; } }
        .button { opacity: 0; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: opacity 0.3s ease; pointer-events: none; }
        .button.visible { opacity: 1; pointer-events: auto; }
        .button.validate { background: #0038B8; color: white; }
        .button.modify { background: #FFC107; color: #333; }
        .button.solution { background: #FF6B6B; color: white; }
        .button.next { background: #4CAF50; color: white; }
        .speaker-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; margin-right: 10px; }
        .result { padding: 15px; border-left: 4px solid; margin: 15px 0; border-radius: 8px; display: none; font-weight: bold; color: #333; }
        .result.show { display: block; }
        .result.correct { background: #E8F5E9; border-color: #4CAF50; }
        .result.partial { background: #FFF3E0; border-color: #FF9800; }
        .result.wrong { background: #FFEBEE; border-color: #f44336; }
        .stats { text-align: center; color: #666; margin-top: 20px; }
        .final-screen { display: none; }
        .final-screen.active { display: block; text-align: center; }
        .score { font-size: 48px; color: #0038B8; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <!-- SETUP -->
        <div class="setup-screen active" id="setupScreen">
            <h1>🇮🇱 MIZOULPAN - Exercices</h1>
            <p class="subtitle">Dictées intelligentes</p>
            
            <div class="section">
                <div class="label">Sens</div>
                <div class="grid">
                    <button class="btn active" onclick="selectSens('fr-he')">Français - Hébreu</button>
                    <button class="btn" onclick="selectSens('he-fr')">Hébreu - Français</button>
                </div>
            </div>
            
            <div class="section">
                <div class="label">Niveau</div>
                <div class="grid">
                    <button class="btn active" onclick="selectLevel('simple')">Simple</button>
                    <button class="btn" onclick="selectLevel('complexe')">Complexe</button>
                </div>
            </div>
            
            <button class="start-btn" onclick="startExercises()">Commencer</button>
            <div class="loading" id="loadingMsg"></div>
        </div>
        
        <!-- EXERCISE -->
        <div class="exercise-screen" id="exerciseScreen">
            <button class="back-btn" onclick="backHome()">← Retour</button>
            <h1>Phrase <span id="phraseNum">1</span> / <span id="totalText">50</span></h1>
            <div class="progress"><div class="progress-bar" id="progBar"></div></div>
            
            <div class="question" id="phraseDisplay"></div>
            
            <div class="audio-buttons">
                <button class="audio-btn" onclick="playAudio()">🔊</button>
                <button class="audio-btn" onclick="startMicrophone()">🎤</button>
            </div>
            
            <input type="text" class="input-box" id="answerInput" placeholder="Tape ta réponse...">
            
            <div class="buttons">
                <button class="button validate visible" id="btnValider" onclick="validateAnswer()">✓ Valider</button>
                <button class="button modify visible" id="btnModifier" onclick="modifyAnswer()">← Modifier</button>
                <button class="button solution visible" id="btnSolution" onclick="showSolution()">💡 Solution</button>
                <button class="button next visible" id="btnSuivante" onclick="nextPhrase()">Suivante →</button>
            </div>
            
            <div class="result" id="resultBox"></div>
            <div class="stats">⭐ <span id="scoreText">0</span> / <span id="totalText">50</span></div>
        </div>
        
        <!-- FINAL -->
        <div class="final-screen" id="finalScreen">
            <h1>🎉 Bravo!</h1>
            <div class="score" id="finalScore">0/50</div>
            <p id="correctMsg"></p>
            <button class="start-btn" onclick="backHome()">Recommencer</button>
        </div>
    </div>
</div>

<script>
const GITHUB_URL = 'https://raw.githubusercontent.com/MUXOIK/mizoulpan-quiz/main/phrases.json';
let state = { sens: 'fr-he', level: 'simple' };
let phrases = [];
let currentIdx = 0;
let answers = [];

function selectSens(s) { state.sens = s; document.querySelectorAll('.grid')[0].querySelectorAll('.btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && s === 'fr-he') || (i === 1 && s === 'he-fr'))); }
function selectLevel(l) { state.level = l; document.querySelectorAll('.grid')[1].querySelectorAll('.btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && l === 'simple') || (i === 1 && l === 'complexe'))); }

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function startExercises() {
    document.getElementById('loadingMsg').innerHTML = 'Chargement...';
    try {
        const res = await fetch(GITHUB_URL + '?t=' + Date.now());
        const data = await res.json();
        phrases = shuffle(state.level === 'simple' ? data.simple : data.complexe);
        currentIdx = 0;
        answers = Array(phrases.length).fill(null);
        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('exerciseScreen').classList.add('active');
        document.getElementById('totalText').textContent = phrases.length;
        displayPhrase();
    } catch (e) { document.getElementById('loadingMsg').innerHTML = 'Erreur: ' + e.message; }
}

function displayPhrase() {
    const p = phrases[currentIdx];
    let text = state.sens === 'fr-he' ? p.fr : p.he;
    
    // Retirer les points au début et fin
    text = text.replace(/^[\.\s]+/, '').replace(/[\.\s]+$/, '');
    
    document.getElementById('phraseDisplay').textContent = text;
    document.getElementById('phraseNum').textContent = currentIdx + 1;
    document.getElementById('answerInput').value = '';
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('progBar').style.width = ((currentIdx / phrases.length) * 100) + '%';
    document.getElementById('scoreText').textContent = answers.filter(a => a && a.correct === 'correct').length;
    
    document.getElementById('btnValider').classList.add('visible');
}

function playAudio() {
    const p = phrases[currentIdx];
    const text = state.sens === 'fr-he' ? p.fr : p.he;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.sens === 'fr-he' ? 'fr-FR' : 'he-IL';
    window.speechSynthesis.speak(u);
}

function startMicrophone() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('❌ Microphone non supporté sur ce navigateur'); return; }
    
    const r = new SR();
    r.lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    
    const micBtn = document.querySelector('.audio-btn:nth-child(2)');
    micBtn.style.animation = 'pulse 1s infinite';
    micBtn.style.opacity = '0.5';
    
    let finalTranscript = '';
    
    r.onstart = () => {
        document.getElementById('answerInput').placeholder = '🎤 Écoute... parle maintenant! (Parle au moins 2-3 sec)';
        console.log('🎤 Microphone démarré');
    };
    
    r.onresult = (e) => {
        let interimTranscript = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const transcript = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
                finalTranscript += transcript + ' ';
            } else {
                interimTranscript += transcript;
            }
        }
        document.getElementById('answerInput').value = (finalTranscript + interimTranscript).trim();
    };
    
    r.onerror = (e) => {
        micBtn.style.animation = 'none';
        micBtn.style.opacity = '1';
        console.log('ERREUR MICRO:', e.error);
        
        const errorMsg = {
            'no-speech': '⚠️ Pas de son détecté. Parle plus fort pendant 2-3 sec!',
            'audio-capture': '❌ Pas accès au micro. Autorise dans Paramètres!',
            'network': '❌ Problème réseau',
            'not-allowed': '❌ Permission refusée. Va en Paramètres > Safari > Micro!',
            'aborted': '⚠️ Micro arrêté. Parle plus longtemps! Réessaie.'
        };
        
        const msg = errorMsg[e.error] || '❌ Erreur: ' + e.error;
        alert(msg);
        document.getElementById('answerInput').placeholder = msg;
        document.getElementById('answerInput').value = '';
    };
    
    r.onend = () => {
        micBtn.style.animation = 'none';
        micBtn.style.opacity = '1';
        
        if (!document.getElementById('answerInput').value.trim()) {
            document.getElementById('answerInput').placeholder = 'Aucun texte. Réessaie en parlant plus longtemps!';
        } else {
            document.getElementById('answerInput').placeholder = 'Tape ta réponse...';
        }
    };
    
    r.start();
}

function colorizeAnswer(userAnswer, correctAnswer) {
    const userWords = userAnswer.toLowerCase().trim().split(/\s+/);
    const correctWords = correctAnswer.toLowerCase().trim().split(/\s+/);
    
    let coloredHtml = '';
    const usedIndices = new Set();
    
    userWords.forEach((userWord) => {
        let bestMatch = { similarity: 0, index: -1 };
        
        // Chercher le mot le plus similaire dans la bonne réponse (qu'on n'a pas encore utilisé)
        correctWords.forEach((correctWord, idx) => {
            if (!usedIndices.has(idx)) {
                const sim = similarity(userWord, correctWord);
                if (sim > bestMatch.similarity) {
                    bestMatch = { similarity: sim, index: idx };
                }
            }
        });
        
        let color = '#FF6B6B'; // rouge par défaut
        
        if (bestMatch.similarity >= 95) {
            color = '#4CAF50'; // exact = vert
        } else if (bestMatch.similarity >= 70) {
            color = '#FFA726'; // presque = orange
        } else {
            color = '#FF6B6B'; // faux = rouge
        }
        
        if (bestMatch.index !== -1) {
            usedIndices.add(bestMatch.index);
        }
        
        coloredHtml += '<span style="color: ' + color + '; font-weight: bold;">' + userWord + '</span> ';
    });
    
    return coloredHtml.trim();
}

function similarity(s1, s2) {
    const a = s1.toLowerCase().trim();
    const b = s2.toLowerCase().trim();
    if (a === b) return 100;
    const longer = a.length > b.length ? a : b;
    const shorter = a.length > b.length ? b : a;
    const ed = levenshtein(longer, shorter);
    return ((longer.length - ed) / longer.length) * 100;
}

function levenshtein(a, b) {
    const arr = [];
    for (let i = 0; i <= b.length; i++) arr[i] = [i];
    for (let j = 0; j <= a.length; j++) arr[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            arr[i][j] = Math.min(arr[i][j-1] + 1, arr[i-1][j] + 1, arr[i-1][j-1] + (a[j-1] !== b[i-1] ? 1 : 0));
        }
    }
    return arr[b.length][a.length];
}

function validateAnswer() {
    const ans = document.getElementById('answerInput').value.trim();
    if (!ans) { alert('Tape une réponse!'); return; }
    
    const p = phrases[currentIdx];
    const correct = state.sens === 'fr-he' ? p.he : p.fr;
    const sim = similarity(ans, correct);
    
    let type = 'wrong', msg = '';
    const lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
    const speakerBtn = '<button class="speaker-btn" data-text="' + correct + '" data-lang="' + lang + '">🔊</button>';
    
    if (sim >= 95) { 
        type = 'correct'; 
        msg = '✅ Bonne! ' + speakerBtn; 
        answers[currentIdx] = { correct: 'correct' }; 
    }
    else if (sim >= 70) { 
        type = 'partial'; 
        msg = '⚠️ Presque!<br><strong>' + ans + '</strong><br><br>💡 Correction: ' + speakerBtn + ' ' + correct; 
        answers[currentIdx] = { correct: 'partial' }; 
    }
    else { 
        type = 'wrong'; 
        msg = '❌ Voici ce que tu as écrit:<br><strong>' + ans + '</strong><br><br>💡 Réponse correcte: ' + speakerBtn + ' ' + correct; 
        answers[currentIdx] = { correct: 'wrong' }; 
    }
    
    const rb = document.getElementById('resultBox');
    rb.innerHTML = msg;
    rb.classList.add('show', type);
    
    // Ajouter event listeners aux boutons speaker
    const speakerBtns = rb.querySelectorAll('.speaker-btn');
    speakerBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const text = this.getAttribute('data-text');
            const lang = this.getAttribute('data-lang');
            speakAnswer(text, lang);
        });
    });
    
    document.getElementById('btnValider').classList.remove('visible');
    document.getElementById('btnModifier').classList.add('visible');
    document.getElementById('btnSolution').classList.add('visible');
    document.getElementById('btnSuivante').classList.add('visible');
    document.getElementById('scoreText').textContent = answers.filter(a => a && a.correct === 'correct').length;
}

function modifyAnswer() {
    document.getElementById('answerInput').focus();
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('btnValider').classList.add('visible');
    document.getElementById('btnModifier').classList.remove('visible');
    document.getElementById('btnSolution').classList.remove('visible');
    document.getElementById('btnSuivante').classList.remove('visible');
}

function showSolution() {
    const p = phrases[currentIdx];
    const correct = state.sens === 'fr-he' ? p.he : p.fr;
    const lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
    
    const answerInput = document.getElementById('answerInput');
    answerInput.value = correct;
    answerInput.style.fontWeight = 'bold';
    answerInput.style.color = 'black !important';
    
    document.getElementById('btnSolution').disabled = true;
    document.getElementById('btnSolution').style.opacity = '0.5';
    
    // Retirer ancien haut-parleur s'il existe
    const existingSpeaker = document.querySelector('.solution-speaker');
    if (existingSpeaker) existingSpeaker.remove();
    
    // Créer le haut-parleur
    const speakerBtn = document.createElement('button');
    speakerBtn.innerHTML = '🔊';
    speakerBtn.className = 'solution-speaker';
    speakerBtn.style.cssText = 'background: none; border: none; font-size: 20px; cursor: pointer; margin-left: 10px; padding: 10px; vertical-align: middle;';
    speakerBtn.type = 'button';
    speakerBtn.onclick = (e) => {
        e.preventDefault();
        speakAnswer(correct, lang);
    };
    
    // Ajouter juste après la boîte de saisie
    answerInput.parentElement.insertBefore(speakerBtn, answerInput.nextSibling);
}

function speakAnswer(text, lang) {
    const synth = window.speechSynthesis;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.8;
    synth.speak(utterance);
}

function nextPhrase() {
    currentIdx++;
    if (currentIdx < phrases.length) displayPhrase();
    else showFinal();
}

function showFinal() {
    const c = answers.filter(a => a && a.correct === 'correct').length;
    const p = answers.filter(a => a && a.correct === 'partial').length;
    document.getElementById('exerciseScreen').classList.remove('active');
    document.getElementById('finalScreen').classList.add('active');
    document.getElementById('finalScore').textContent = c + '/' + phrases.length;
    document.getElementById('correctMsg').textContent = c + ' bonnes, ' + p + ' presque';
}

function backHome() {
    document.getElementById('setupScreen').classList.add('active');
    document.getElementById('exerciseScreen').classList.remove('active');
    document.getElementById('finalScreen').classList.remove('active');
}
</script>
</body>
</html>
