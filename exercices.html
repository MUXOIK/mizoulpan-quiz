<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN - Exercices</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style-global.css">
    <style>
        /* PAGE HEADER - DRAPEAUX + TITRE + BULLE */
        .page-header {
            position: relative;
            background: #dcecf8;
            border-radius: 28px;
            padding: 40px;
            margin-bottom: 12px;
            overflow: visible;
        }

        .title-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }

        .title-zone h1 {
            color: #0057D9;
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .flag-icon {
            width: clamp(58px, 10vw, 110px);
            height: auto;
            border-radius: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
        }

        .corner-logo {
            position: absolute;
            top: -25px;
            right: -25px;
            width: 58px;
            height: auto;
            z-index: 100;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 25px 15px;
            }

            .corner-logo {
                width: 34px;
                top: -10px;
                right: -10px;
            }

            .title-zone {
                gap: 8px;
            }

            .flag-icon {
                width: 34px;
            }

            .title-zone h1 {
                font-size: 1.8rem;
            }
        }
        /* SPÉCIFIQUE AUX EXERCICES */
        .section-label {
            font-size: 0.75rem;
            color: var(--primary-blue);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .pill {
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-light);
            background: var(--white);
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .pill:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .pill.active {
            border-color: var(--primary-blue);
            background: var(--primary-blue);
            color: var(--white);
        }

        .count-info {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 24px;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
            color: var(--white);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 56, 184, 0.2);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 56, 184, 0.3);
        }

        /* SETUP & EXERCISE SCREENS */
        .setup-screen {
            display: none;
        }

        .setup-screen.active {
            display: block;
        }

        .exercise-screen {
            display: none;
        }

        .exercise-screen.active {
            display: block;
        }

        .final-screen {
            display: none;
        }

        .final-screen.active {
            display: block;
            text-align: center;
        }

        /* EXERCISE CONTENT */
        .progress {
            width: 100%;
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-blue);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.8rem;
            text-align: center;
            background: var(--bg-light);
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            direction: rtl;
            font-family: 'Arial Hebrew', 'David', serif;
            font-weight: 600;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .audio-btn {
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.2s ease;
        }

        .audio-btn:hover {
            transform: scale(1.2);
        }

        .input-box {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            margin: 20px 0;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            opacity: 0;
            pointer-events: none;
        }

        .button.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .button.validate {
            background: var(--primary-blue);
            color: var(--white);
        }

        .button.validate:hover {
            background: var(--primary-blue-dark);
            transform: translateY(-1px);
        }

        .button.modify {
            background: #FFC107;
            color: #333;
        }

        .button.modify:hover {
            background: #FFB300;
        }

        .button.solution {
            background: #FF6B6B;
            color: var(--white);
        }

        .button.solution:hover {
            background: #FF5252;
        }

        .button.next {
            background: #4CAF50;
            color: var(--white);
        }

        .button.next:hover {
            background: #43A047;
        }

        .result {
            padding: 15px;
            border-left: 4px solid;
            margin: 20px 0;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            color: #333;
            animation: slideDown 0.3s ease;
        }

        .result.show {
            display: block;
        }

        .result.correct {
            background: #E8F5E9;
            border-color: #4CAF50;
            color: #1B5E20;
        }

        .result.partial {
            background: #FFF3E0;
            border-color: #FF9800;
            color: #E65100;
        }

        .result.wrong {
            background: #FFEBEE;
            border-color: #f44336;
            color: #B71C1C;
        }

        .stats {
            text-align: center;
            color: var(--text-light);
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .score {
            font-size: 3rem;
            color: var(--primary-blue);
            font-weight: bold;
            margin: 20px 0;
        }

        .trophy {
            font-size: 4rem;
            margin: 20px 0;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .question {
                font-size: 1.5rem;
                padding: 20px;
                min-height: 50px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .button {
                padding: 12px;
                font-size: 0.9rem;
            }

            .audio-btn {
                font-size: 2rem;
            }

            .input-box {
                font-size: 1rem;
                padding: 12px;
            }

            .score {
                font-size: 2.5rem;
            }

            .trophy {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- LOGO MIZOULPAN - REMONTÉ PRÈS DU TITRE -->
            <!-- PAGE HEADER AVEC DRAPEAUX -->
            <div class="page-header">
                <div class="title-zone">
                    <img src="israel.png" alt="Israël" class="flag-icon">
                    <h1>MIZOULPAN</h1>
                    <img src="france.png" alt="France" class="flag-icon">
                </div>
                <!-- BULLE EN HAUT À DROITE -->
                <img src="logo-mizoulpan.png" alt="MIZOULPAN" class="corner-logo">
            </div>
            
            <!-- EXERCICES -->
            <p style="text-align: center; margin: 4px 0 16px; font-size: 0.9rem; color: #0057D9; font-weight: 500;">Exercices</p>

            <!-- RETOUR - COMPACT - INTELLIGENT -->
            <a href="#" class="back-button" style="margin-bottom: 8px;" onclick="goBack(event)">← Retour</a>

            <!-- ════ SETUP SCREEN ════ -->
            <div class="setup-screen active" id="setupScreen">
                <!-- CONTENU SETUP -->

                <!-- OPTIONS -->
                <div style="margin-top: 30px;">
                    <div class="section-label">Sens</div>
                    <div class="pills">
                        <button class="pill active" onclick="selectSens('fr-he')">🇫🇷 Français → עברית</button>
                        <button class="pill" onclick="selectSens('he-fr')">עברית → 🇫🇷 Français</button>
                    </div>

                    <div class="section-label">Niveau</div>
                    <div class="pills">
                        <button class="pill active" onclick="selectLevel('simple')">Simple</button>
                        <button class="pill" onclick="selectLevel('complexe')">Complexe</button>
                    </div>

                    <div class="count-info" id="countInfo"></div>
                    <button class="start-btn" onclick="startExercises()">Commencer →</button>
                </div>
            </div>

            <!-- ════ EXERCISE SCREEN ════ -->
            <div class="exercise-screen" id="exerciseScreen">
                <!-- CONTENU EXERCICE -->
                <div style="margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span id="phraseNum" style="font-weight: bold; color: var(--primary-blue);">1</span>
                        <span id="progress" style="color: var(--text-light); font-size: 0.9rem;">1 / <span id="totalText">50</span></span>
                    </div>

                    <div class="progress"><div class="progress-bar" id="progBar" style="width: 0%"></div></div>
                    
                    <div class="question" id="phraseDisplay"></div>
                    
                    <div class="audio-buttons">
                        <button class="audio-btn" onclick="playAudio()">🔊</button>
                        <button class="audio-btn" onclick="startMicrophone()">🎤</button>
                    </div>
                    
                    <input type="text" class="input-box" id="answerInput" placeholder="Tape ta réponse...">
                    
                    <div class="buttons">
                        <button class="button validate visible" id="btnValider" onclick="validateAnswer()">✓ Valider</button>
                        <button class="button modify visible" id="btnModifier" onclick="modifyAnswer()">← Modifier</button>
                        <button class="button solution visible" id="btnSolution" onclick="showSolution()">💡 Solution</button>
                        <button class="button next visible" id="btnSuivante" onclick="nextPhrase()">Suivante →</button>
                    </div>
                    
                    <div class="result" id="resultBox"></div>
                    <div class="stats">⭐ <span id="scoreText">0</span> / <span id="totalText">50</span></div>
                </div>
            </div>

            <!-- ════ FINAL SCREEN ════ -->
            <div class="final-screen" id="finalScreen">
                <header>
                    <div class="header-flags">
                        <img src="israel.png" alt="Israël" class="flag-icon">
                        <h1>MIZOULPAN</h1>
                        <img src="france.png" alt="France" class="flag-icon">
                    </div>
                    <p class="page-subtitle">Exercices</p>
                </header>

                <div style="margin-top: 30px;">
                    <div class="trophy">🎉</div>
                    <h2 style="color: var(--primary-blue); margin-bottom: 20px;">Bravo!</h2>
                    <div class="score" id="finalScore">0/50</div>
                    <p id="correctMsg" style="color: var(--text-light); margin-bottom: 30px;"></p>
                    <a href="accueil.html" class="back-button" style="display: inline-block;">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ════ CONFIGURATION (INCHANGÉE) ════
        const GITHUB_URL = 'phrases.json';
        let state = { sens: 'fr-he', level: 'simple' };
        let phrases = [];
        let currentIdx = 0;
        let answers = [];

        // ════ SÉLECTIONS (INCHANGÉES) ════
        function selectSens(s) {
            state.sens = s;
            document.querySelectorAll('.pills')[0].querySelectorAll('.pill').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && s === 'fr-he') || (i === 1 && s === 'he-fr'));
            });
        }

        function selectLevel(l) {
            state.level = l;
            document.querySelectorAll('.pills')[1].querySelectorAll('.pill').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && l === 'simple') || (i === 1 && l === 'complexe'));
            });
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ════ DÉMARRAGE EXERCICES ════
        function goBack(event) {
            event.preventDefault();
            const exerciseScreen = document.getElementById("exerciseScreen");
            const setupScreen = document.getElementById("setupScreen");
            
            // Si on est sur la page 2 (exercices) → retour à page 1 (setup)
            if (exerciseScreen.classList.contains("active")) {
                exerciseScreen.classList.remove("active");
                setupScreen.classList.add("active");
            } else {
                // Sinon → retour à accueil
                window.location.href = "accueil.html";
            }
        }


        async function startExercises() {
            try {
                const res = await fetch(GITHUB_URL + '?t=' + Date.now());
                const data = await res.json();
                phrases = shuffle(state.level === 'simple' ? data.simple : data.complexe);
                currentIdx = 0;
                answers = Array(phrases.length).fill(null);
                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('exerciseScreen').classList.add('active');
                document.getElementById('totalText').textContent = phrases.length;
                document.querySelectorAll('#totalText').forEach(el => el.textContent = phrases.length);
                displayPhrase();
            } catch (e) {
                alert('Erreur: ' + e.message);
            }
        }

        // ════ AFFICHER PHRASE (INCHANGÉE) ════
        function displayPhrase() {
            const p = phrases[currentIdx];
            let text = state.sens === 'fr-he' ? p.fr : p.he;
            text = text.replace(/^[\.\s]+/, '').replace(/[\.\s]+$/, '');
            
            document.getElementById('phraseDisplay').textContent = text;
            document.getElementById('phraseNum').textContent = currentIdx + 1;
            document.getElementById('answerInput').value = '';
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('progBar').style.width = ((currentIdx / phrases.length) * 100) + '%';
            document.getElementById('scoreText').textContent = answers.filter(a => a && a.correct === 'correct').length;
            document.getElementById('btnValider').classList.add('visible');
            
            // Enlever ancien speaker et réinitialiser
            const oldSpeaker = document.getElementById('solutionSpeaker');
            if (oldSpeaker) oldSpeaker.remove();
            document.getElementById('btnSolution').disabled = false;
            document.getElementById('btnSolution').style.opacity = '1';
            document.getElementById('answerInput').style.fontWeight = 'normal';
        }

        let recognitionInstance = null;  // RÉFÉRENCE GLOBALE pour le micro
        let lastSpeechText = null;  // Tracker la dernière phrase parlée

        // ════ AUDIO & MICROPHONE ════
        function playAudio() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            const p = phrases[currentIdx];
            const text = state.sens === 'fr-he' ? p.fr : p.he;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = state.sens === 'fr-he' ? 'fr-FR' : 'he-IL';
            window.speechSynthesis.speak(u);
        }

        function startMicrophone() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                alert('❌ Microphone non supporté');
                return;
            }

            if (recognitionInstance) {
                try { recognitionInstance.abort(); } catch (e) {}
                recognitionInstance = null;
            }

            const r = new SR();
            recognitionInstance = r;

            r.lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
            r.continuous = false;
            r.interimResults = true;
            r.maxAlternatives = 1;

            const input = document.getElementById('answerInput');
            const micBtn = document.querySelector('.audio-btn:nth-child(2)');

            micBtn.style.opacity = '0.5';
            input.placeholder = '🎤 Écoute...';

            r.onresult = (e) => {
                let text = '';
                for (let i = 0; i < e.results.length; i++) {
                    text += e.results[i][0].transcript;
                }
                input.value = text.trim();
            };

            r.onerror = (e) => {
                micBtn.style.opacity = '1';
                recognitionInstance = null;
                if (e.error !== 'aborted' && e.error !== 'no-speech') {
                    alert('Erreur micro: ' + e.error);
                }
            };

            r.onend = () => {
                micBtn.style.opacity = '1';
                recognitionInstance = null;
                input.placeholder = 'Tape ta réponse...';
            };

            r.start();
        }

        function stopMicrophone() {
            if (recognitionInstance) {
                try {
                    recognitionInstance.abort();  // ← abort() au lieu de stop()
                } catch (e) {}
                recognitionInstance = null;
            }
        }
            


        // ════ VALIDATIONS (SIMPLIFIÉE) ════
        function similarity(s1, s2) {
            const a = s1.toLowerCase().trim();
            const b = s2.toLowerCase().trim();
            if (a === b) return 100;
            const longer = a.length > b.length ? a : b;
            const shorter = a.length > b.length ? b : a;
            const ed = levenshtein(longer, shorter);
            return ((longer.length - ed) / longer.length) * 100;
        }

        function levenshtein(a, b) {
            const arr = [];
            for (let i = 0; i <= b.length; i++) arr[i] = [i];
            for (let j = 0; j <= a.length; j++) arr[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    arr[i][j] = Math.min(
                        arr[i][j-1] + 1,
                        arr[i-1][j] + 1,
                        arr[i-1][j-1] + (a[j-1] !== b[i-1] ? 1 : 0)
                    );
                }
            }
            return arr[b.length][a.length];
        }

        function validateAnswer() {
            const ans = document.getElementById('answerInput').value.trim();
            if (!ans) { alert('Tape une réponse!'); return; }
            
            const p = phrases[currentIdx];
            const correct = state.sens === 'fr-he' ? p.he : p.fr;
            const sim = similarity(ans, correct);
            
            let type = 'wrong', msg = '';
            
            if (sim >= 95) {
                type = 'correct';
                msg = '✅ Bonne réponse!';
                answers[currentIdx] = { correct: 'correct' };
            } else if (sim >= 70) {
                type = 'partial';
                msg = '⚠️ Presque!<br><strong>' + ans + '</strong><br><br>Réponse: <strong>' + correct + '</strong>';
                answers[currentIdx] = { correct: 'partial' };
            } else {
                type = 'wrong';
                msg = '❌ Voici ce que tu as écrit:<br><strong>' + ans + '</strong><br><br>Réponse correcte: <strong>' + correct + '</strong>';
                answers[currentIdx] = { correct: 'wrong' };
            }
            
            const rb = document.getElementById('resultBox');
            rb.innerHTML = msg;
            rb.classList.add('show', type);
            
            document.getElementById('btnValider').classList.remove('visible');
            document.getElementById('btnModifier').classList.add('visible');
            document.getElementById('btnSolution').classList.add('visible');
            document.getElementById('btnSuivante').classList.add('visible');
            document.getElementById('scoreText').textContent = answers.filter(a => a && a.correct === 'correct').length;
        }

        function modifyAnswer() {
            document.getElementById('answerInput').focus();
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('btnValider').classList.add('visible');
            document.getElementById('btnModifier').classList.remove('visible');
            document.getElementById('btnSolution').classList.remove('visible');
            document.getElementById('btnSuivante').classList.remove('visible');
        }

        function showSolution() {
            const p = phrases[currentIdx];
            const correct = state.sens === 'fr-he' ? p.he : p.fr;
            const lang = state.sens === 'fr-he' ? 'he-IL' : 'fr-FR';
            
            document.getElementById('answerInput').value = correct;
            document.getElementById('answerInput').style.fontWeight = 'bold';
            document.getElementById('btnSolution').disabled = true;
            document.getElementById('btnSolution').style.opacity = '0.5';
            
            // SPEAKER POUR LA SOLUTION - créer ou mettre à jour
            let speakerBtn = document.getElementById('solutionSpeaker');
            if (!speakerBtn) {
                speakerBtn = document.createElement('button');
                speakerBtn.id = 'solutionSpeaker';
                speakerBtn.className = 'audio-btn';
                speakerBtn.textContent = '🔊';
                speakerBtn.style.marginLeft = '8px';
                document.getElementById('answerInput').after(speakerBtn);
            }
            // TOUJOURS mettre à jour le onclick (même si le bouton existe)
            speakerBtn.onclick = (e) => {
                e.preventDefault();
                speakAnswer(correct, lang);
            };
        }

        function speakAnswer(text, lang) {
            if (!window.speechSynthesis) {
                alert("Audio non supporté sur ce navigateur");
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.85;

            window.speechSynthesis.speak(utterance);
        }

        function nextPhrase() {
            currentIdx++;
            if (currentIdx < phrases.length) {
                displayPhrase();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            const c = answers.filter(a => a && a.correct === 'correct').length;
            const p = answers.filter(a => a && a.correct === 'partial').length;
            document.getElementById('exerciseScreen').classList.remove('active');
            document.getElementById('finalScreen').classList.add('active');
            document.getElementById('finalScore').textContent = c + '/' + phrases.length;
            document.getElementById('correctMsg').textContent = c + ' bonnes, ' + p + ' presque';
        }
    </script>

</body>
</html>
