<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #0038b8; --blue2: #002d94; --blue-light: #e8eef8; --blue-mid: #c5d4f0;
  --white: #ffffff; --text: #0a1a3a; --dim: rgba(0,40,120,0.55);
  --border: rgba(0,56,184,0.18); --card: rgba(255,255,255,0.96);
  --green: #1a7a3a; --red: #b01a1a; --yellow: #8a6500;
  --shadow: 0 4px 24px rgba(0,56,184,0.10); --shadow-lg: 0 8px 40px rgba(0,56,184,0.15);
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Heebo', sans-serif;
  background: linear-gradient(160deg, #f0f5ff 0%, #dce8ff 50%, #c8d8f8 100%);
  background-attachment: fixed;
  color: var(--text); min-height: 100vh;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}

/* ── HEADER ── */
#header {
  background: var(--blue); padding: 0 16px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 20px rgba(0,56,184,0.3);
}
.header-top {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0 10px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.logo-flag { font-size: 2rem; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
.logo-text { flex: 1; }
.logo-name { font-size: 1.4rem; font-weight: 900; color: white; letter-spacing: -0.5px; line-height: 1.1; }
.logo-name span { color: #a8c4ff; }
.logo-sub { font-size: 0.72rem; color: rgba(200,220,255,0.75); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }

/* ── TABS avec indicateur scroll ── */
.tabs-outer {
  position: relative;
  /* Dégradé droit pour signaler qu'il y a du contenu scrollable */
}
.tabs-outer::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 48px;
  background: linear-gradient(to right, transparent, var(--blue));
  pointer-events: none;
  border-radius: 0;
  transition: opacity .3s;
}
.tabs-outer.scrolled-end::after { opacity: 0; }
.tabs-scroll {
  display: flex; overflow-x: auto; gap: 4px;
  padding: 8px 48px 0 0; /* espace pour le dégradé */
  scrollbar-width: none;
}
.tabs-scroll::-webkit-scrollbar { display: none; }
.tab {
  padding: 10px 16px; border-radius: 8px 8px 0 0; border: none; cursor: pointer;
  font-size: 1rem; font-weight: 700; font-family: 'Heebo', sans-serif;
  background: rgba(255,255,255,0.92); color: #0a1a3a;
  white-space: nowrap; transition: all .2s;
  border-bottom: 3px solid transparent; flex-shrink: 0;
}
.tab:hover { background: white; color: var(--blue); }
.tab.active { background: white; color: var(--blue); font-weight: 900; border-bottom-color: var(--blue); box-shadow: 0 -2px 8px rgba(255,255,255,0.3); }
.tab .badge {
  display: inline-block; font-size: 0.78rem; background: var(--blue);
  color: white; border-radius: 20px; padding: 1px 7px; margin-left: 5px; font-weight: 700;
}
.tab .badge.has-score {
  background: var(--green);
}
.tab.active .badge { background: var(--blue); }

/* ── BODY ── */
#body { padding: 16px 14px 0; max-width: 520px; margin: 0 auto; }
.card { background: var(--card); border-radius: 20px; padding: 22px 20px; box-shadow: var(--shadow-lg); margin-bottom: 16px; }
.hidden { display: none !important; }

/* ── TOAST voix indisponible ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1a1a2e; color: white; padding: 12px 20px; border-radius: 12px;
  font-size: 0.88rem; font-weight: 600; z-index: 999;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
  opacity: 0; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── LOADING ── */
#loading-screen { text-align: center; padding: 60px 20px; }
.loading-spinner {
  width: 56px; height: 56px; border: 5px solid var(--blue-mid);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.9s linear infinite; margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 1.2rem; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
.loading-sub { font-size: 0.9rem; color: var(--dim); }
.loading-error { color: var(--red); font-size: 0.95rem; margin-top: 16px; line-height: 1.5; }

/* ── SETUP ── */
.section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.pill { padding: 10px 16px; border-radius: 10px; border: 2px solid var(--border); background: white; color: var(--dim); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all .2s; }
.pill.active { border-color: var(--blue); background: var(--blue); color: white; }
.count-info { font-size: 0.82rem; color: var(--dim); margin-bottom: 18px; }
.start-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(135deg,var(--blue),var(--blue2)); color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: 'Heebo',sans-serif; letter-spacing: 0.5px; transition: all .2s; box-shadow: 0 4px 16px rgba(0,56,184,0.3); }
.start-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,56,184,0.4); }

/* ── QUIZ ── */

.back-link { color: var(--blue); font-size: 0.88rem; font-weight: 600; cursor: pointer; text-decoration: none; background: none; border: none; padding: 0; font-family: inherit; }
.counter { font-size: 0.88rem; color: var(--dim); font-weight: 600; }
.score-disp { font-size: 0.88rem; color: var(--blue); font-weight: 700; }
.prog-wrap { height: 5px; background: var(--blue-mid); border-radius: 99px; margin-bottom: 18px; cursor: pointer; position: relative; }
.prog-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .4s ease; }
.nav-panel { background: var(--blue-light); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
.nav-dots { display: flex; flex-wrap: wrap; gap: 6px; }
.nav-dot { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border); background: white; color: var(--dim); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all .15s; }
.nav-dot.current { background: var(--blue); color: white; border-color: var(--blue); }
.nav-dot.done { background: var(--blue-mid); border-color: var(--blue-mid); color: var(--blue2); }

.q-box { background: var(--blue-light); border-radius: 14px; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.q-text { font-weight: 800; flex: 1; }
.q-text.fr { font-size: 1.45rem; }

.spk-btn { background: white; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 1.2rem; cursor: pointer; box-shadow: var(--shadow); transition: all .2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.spk-btn:hover { background: var(--blue-light); }
.spk-btn.speaking { background: var(--blue); animation: pulse .6s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.choice-wrap { display: flex; align-items: center; gap: 6px; }
.choice-spk { background: none; border: none; font-size: 1.5rem; cursor: pointer; flex-shrink: 0; width: 38px; padding: 0; }
.choice {

  background: white; color: var(--text); cursor: pointer; font-family: 'Heebo', sans-serif;

.choice.he { font-size: 1.55rem; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; }
.choice:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-light); }

.dontknow-btn { width: 100%; padding: 12px; border-radius: 12px; border: 2px dashed var(--border); background: transparent; color: var(--dim); font-size: 0.92rem; font-weight: 600; cursor: pointer; font-family: 'Heebo',sans-serif; transition: all .2s; margin-bottom: 10px; }
.dontknow-btn:hover { border-color: var(--blue); color: var(--blue); }
.reveal-box { background: var(--blue-light); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.reveal-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
.reveal-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reveal-word { font-size: 1.5rem; font-weight: 800; flex: 1; }
.reveal-word.he { font-family: 'Frank Ruhl Libre', serif; direction: rtl; font-size: 1.8rem; }

.reveal-trans { font-size: 0.88rem; color: var(--dim); margin-top: 6px; font-style: italic; }
.next-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg,var(--blue),var(--blue2)); color: white; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: 'Heebo',sans-serif; transition: all .2s; }
.next-btn:hover { transform: translateY(-1px); }

/* ── RESULT ── */
.trophy-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
.result-label { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--blue); margin-bottom: 18px; }
.stats-row { display: flex; justify-content: center; gap: 32px; margin-bottom: 20px; }
.stat { text-align: center; }
.stat-num { font-size: 2rem; font-weight: 900; color: var(--blue); }
.stat-lbl { font-size: 0.75rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.errors-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
.error-item { background: rgba(176,26,26,0.10); border: 1px solid rgba(176,26,26,0.3); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
.error-row { display: flex; justify-content: space-between; align-items: center; }
.error-fr { font-weight: 600; color: var(--text); }
.error-he { font-family: 'Frank Ruhl Libre', serif; font-size: 1.1rem; color: var(--blue); direction: rtl; }
.error-trans { font-size: 0.8rem; color: var(--dim); margin-top: 4px; font-style: italic; }
.result-btns { display: flex; gap: 10px; }
.restart-btn { flex: 1; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg,var(--blue),var(--blue2)); color: white; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: 'Heebo',sans-serif; }
.outline-btn { flex: 1; padding: 14px; border-radius: 14px; border: 2px solid var(--blue); background: transparent; color: var(--blue); font-size: 1rem; font-weight: 700; cursor: pointer; font-family: 'Heebo',sans-serif; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .choices { grid-template-columns: 1fr 1fr; gap: 8px; }

  .q-text.he { font-size: 1.7rem; }
  .choice { padding: 14px 10px; font-size: 1.45rem; }
  .choice.he { font-size: 1.5rem; }
  .logo-name { font-size: 1.2rem; }
  #body { padding: 12px 10px 0; }

  #body { padding: 20px 20px 0; }

}
</style>

  </div>

<script>
// ── PARSING EXCEL ─────────────────────────────────────────────────────────────
const isHeb = s => /[\u0590-\u05FF]/.test(String(s||''));
const SKIP = ['traduction','singulier','feminin','masculin','verbe','mois','fruits','saison',
  'lieux','direction','classroom','hebreu','pluriel','transcription','couleur','famille',
  'expression','corps','transport','temps'];

function parseSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet,{header:1,defval:null})
    .map(r=>r.map(v=>v===null?'':String(v).trim()));
  const numCols = Math.max(...rows.map(r=>r.length),0);
  if(numCols<2) return [];
  const heOnly=new Array(numCols).fill(0), frOnly=new Array(numCols).fill(0);
  for(const row of rows) for(let j=0;j<row.length;j++){
    if(!row[j]) continue;
    if(isHeb(row[j])) heOnly[j]++; else frOnly[j]++;
  }
  const heCol=heOnly.indexOf(Math.max(...heOnly));
  let frCol=-1;
  for(let j=0;j<numCols;j++){
    if(j===heCol||heOnly[j]>2||frOnly[j]<3) continue;
    if(frCol===-1||frOnly[j]>frOnly[frCol]*1.1) frCol=j;
    else if(frOnly[j]>=frOnly[frCol]*0.9&&j<frCol) frCol=j;
  }
  if(frCol===-1) return [];
  const used=new Set([frCol,heCol]);
  let transCol=-1;
  for(let j=0;j<numCols;j++){
    if(used.has(j)) continue;
    const s=rows.slice(0,5).map(r=>r[j]||'').join(' ').toLowerCase();
    if(s.includes('trans')||s.includes('prononc')){transCol=j;break;}
  }
  const result=[], seen=new Set();
  for(const row of rows){
    const fr=row[frCol]||'', he=row[heCol]||'';
    if(!fr||!he||!isHeb(he)) continue;
    const fl=fr.toLowerCase().trim();
    if(SKIP.some(k=>fl===k||fl.startsWith(k+' ')||fl.startsWith(k+'/'))) continue;
    const key=fr+'|'+he;
    if(seen.has(key)) continue;
    seen.add(key);
    const entry={fr,he};
    if(transCol!==-1&&row[transCol]&&!isHeb(row[transCol])) entry.trans=row[transCol];
    result.push(entry);
  }
  return result;
}

const TAB_ICONS = {verbes:'📚',liaison:'🔗',interrogation:'❓',adjectif:'✨',vocabulaire:'📖',
  transport:'🚌',classeroom:'🏫',couleur:'🎨',famille:'👨‍👩‍👧',métier:'💼',
  lieux:'📍',nourriture:'🍎',expression:'💬',chiffres:'🔢',temps:'⏰'};

// ── STATE ─────────────────────────────────────────────────────────────────────
let allData={}, currentTab=null, direction='fr→he', quizOrder='random';
let quiz=[], idx=0, score=0, errors=[], answered=false;
let visited=new Set([0]), showNav=false;

const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove('hidden');
const hide=id=>$(id).classList.add('hidden');
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── LOCALSTORAGE : scores par catégorie ───────────────────────────────────────
const LS_KEY = 'mizoulpan_scores';
function loadScores() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ return {}; }
}
function saveScore(tab, correct, total) {
  const scores = loadScores();
  scores[tab] = { correct, total, pct: Math.round(correct/total*100), date: Date.now() };
  try { localStorage.setItem(LS_KEY, JSON.stringify(scores)); } catch(e){}
}
function loadLastTab() {
  try { return localStorage.getItem('mizoulpan_last_tab')||null; } catch(e){ return null; }
}
function saveLastTab(tab) {
  try { localStorage.setItem('mizoulpan_last_tab', tab); } catch(e){}
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer=null, heVoiceWarningShown=false;
function showToast(msg, duration=3500) {
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), duration);
}

// ── VOIX ──────────────────────────────────────────────────────────────────────
let cachedVoiceHe=null, cachedVoiceFr=null;

function pickFemaleVoice(lang){
  const voices=window.speechSynthesis.getVoices();
  if(lang==='he-IL'){
    if(cachedVoiceHe) return cachedVoiceHe;
    const heVoices=voices.filter(x=>x.lang.startsWith('he'));
    let v=heVoices.find(x=>/anat|carmit|tali|dana|miriam|female|woman/i.test(x.name));
    if(!v) v=heVoices.find(x=>x.name.toLowerCase().indexOf('male')===-1);
    if(!v) v=heVoices[0]||null;
    cachedVoiceHe=v; return v;
  } else {
    if(cachedVoiceFr) return cachedVoiceFr;
    const frVoices=voices.filter(x=>x.lang.startsWith('fr'));
    let v=frVoices.find(x=>/amelie|audrey|claire|marie|female|woman/i.test(x.name));
    if(!v) v=frVoices.find(x=>x.name.toLowerCase().indexOf('thomas')===-1&&x.name.toLowerCase().indexOf('male')===-1);
    if(!v) v=frVoices[0]||null;
    cachedVoiceFr=v; return v;
  }
}

function speak(text,lang,btn){
  if(!window.speechSynthesis) return;

  // Vérifier dispo voix hébraïque et prévenir l'utilisateur une seule fois
  if(lang==='he-IL' && !heVoiceWarningShown){
    const voices=window.speechSynthesis.getVoices();
    const hasHe=voices.some(x=>x.lang.startsWith('he'));
    if(!hasHe){
      heVoiceWarningShown=true;
      showToast('🔇 Voix hébraïque non disponible sur cet appareil');
      return;
    }
  }

  window.speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=0.85; u.volume=1; u.pitch=1;
    try{ const v=pickFemaleVoice(lang); if(v) u.voice=v; }catch(e){}
    u.onerror=()=>{
      if(btn) btn.classList.remove('speaking');
      try{
        const u2=new SpeechSynthesisUtterance(text);
        u2.lang=lang; u2.rate=0.85;
        window.speechSynthesis.speak(u2);
      }catch(e){}
    };
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  },50);
}
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=()=>{
    cachedVoiceHe=null; cachedVoiceFr=null;
    window.speechSynthesis.getVoices();
  };
}

// ── SCROLL INDICATOR TABS ─────────────────────────────────────────────────────
function initTabsScroll(){
  const scroll=$('tabs-scroll');
  const outer=$('tabs-outer');
  function check(){
    const atEnd=scroll.scrollLeft+scroll.clientWidth>=scroll.scrollWidth-4;
    outer.classList.toggle('scrolled-end', atEnd);
  }
  scroll.addEventListener('scroll', check, {passive:true});
  setTimeout(check, 300);
  // Petit scroll auto au chargement pour signaler qu'il y a du contenu
  setTimeout(()=>{
    if(scroll.scrollWidth>scroll.clientWidth){
      scroll.scrollTo({left:60,behavior:'smooth'});
      setTimeout(()=>scroll.scrollTo({left:0,behavior:'smooth'}),600);
    }
  },800);
}

// ── CHARGEMENT EXCEL avec cache intelligent ────────────────────────────────────
// Cache localStorage : 1h max → réduit drastiquement la bande passante Netlify
// Pour forcer un rechargement immédiat : ajouter ?refresh à l'URL
const CACHE_KEY = 'mizoulpan_vocab_data';
const CACHE_TS_KEY = 'mizoulpan_vocab_ts';
const CACHE_VER_KEY = 'mizoulpan_vocab_ver';
const CACHE_DURATION = 60 * 60 * 1000; // 1 heure en ms
const APP_VERSION = 'v9.0'; // changer ici à chaque nouveau vocabulaire.xlsx

function parseAndInit(buf){
  const wb=XLSX.read(buf,{type:'array'});
  allData={};
  for(const name of wb.SheetNames){
    const words=parseSheet(wb.Sheets[name]);
    if(words.length>0) allData[name]=words;
  }
  if(Object.keys(allData).length===0) throw new Error('Aucun mot trouvé dans le fichier.');
  initApp();
}

function loadVocabulaire(){
  const forceRefresh = location.search.includes('refresh');

  // Essayer de charger depuis le cache localStorage
  if(!forceRefresh){
    try{
      const cachedVer = localStorage.getItem(CACHE_VER_KEY);
      const cachedTs  = parseInt(localStorage.getItem(CACHE_TS_KEY)||'0');
      const cachedRaw = localStorage.getItem(CACHE_KEY);
      const age = Date.now() - cachedTs;

      if(cachedRaw && cachedVer === APP_VERSION && age < CACHE_DURATION){
        // Données fraîches en cache — pas de téléchargement réseau !
        allData = JSON.parse(cachedRaw);
        if(Object.keys(allData).length > 0){ initApp(); return; }
      }
    }catch(e){}
  }

  // Téléchargement réseau (1x par heure max)
  // Version mensuelle dans l'URL pour invalider le cache navigateur lors des mises à jour
  const monthStamp = new Date().toISOString().slice(0,7); // ex: "2026-06"
  fetch(`vocabulaire.xlsx?m=${monthStamp}`)
    .then(r=>{ if(!r.ok) throw new Error(`Fichier introuvable (${r.status})`); return r.arrayBuffer(); })
    .then(buf=>{
      parseAndInit(buf);
      // Sauvegarder en localStorage pour les prochains chargements
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
        localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
        localStorage.setItem(CACHE_VER_KEY, APP_VERSION);
      }catch(e){}
    })
    .catch(err=>{
      // Si échec réseau, essayer quand même le cache même expiré
      try{
        const cachedRaw = localStorage.getItem(CACHE_KEY);
        if(cachedRaw){
          allData = JSON.parse(cachedRaw);
          if(Object.keys(allData).length > 0){ initApp(); return; }
        }
      }catch(e){}
      const errEl=$('loading-error');
      errEl.innerHTML=`❌ Impossible de charger le vocabulaire.<br><small>${err.message}</small><br><br>
        <small>Vérifiez que <strong>vocabulaire.xlsx</strong> est bien présent sur Netlify.</small>`;
      show('loading-error');
    });
}

// ── APP INIT ──────────────────────────────────────────────────────────────────
function initApp(){
  buildTabs();
  // Restaurer la dernière catégorie
  const last=loadLastTab();
  currentTab=(last&&allData[last])?last:Object.keys(allData)[0];
  setActiveTab(currentTab);
  hide('loading-screen');
  show('setup-screen');
  initTabsScroll();
  scrollToActiveTab();
}

function buildTabs(){
  const container=$('tabs');
  container.innerHTML='';
  const scores=loadScores();
  for(const name of Object.keys(allData)){
    const btn=document.createElement('button');
    btn.className='tab'+(name===currentTab?' active':'');
    btn.dataset.name=name;
    const icon=TAB_ICONS[name]||'📌';
    const sc=scores[name];
    // Badge : si score récent, afficher le % en vert
    let badgeClass='badge'+(sc?' has-score':'');
    let badgeText=sc?`${sc.pct}%`:String(allData[name].length);
    btn.innerHTML=`${icon} ${name}<span class="${badgeClass}">${badgeText}</span>`;
    btn.addEventListener('click',()=>{ currentTab=name; setActiveTab(name); showSetup(); saveLastTab(name); });
    container.appendChild(btn);
  }
}

function setActiveTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.name===name));
  $('count-info').textContent=`${allData[name].length} mots · QCM 4 choix`;
}

function scrollToActiveTab(){
  const active=document.querySelector('.tab.active');
  if(active) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// ── QUIZ ──────────────────────────────────────────────────────────────────────
function buildQuiz(words,dir){
  const ordered=quizOrder==='sequential'?words:shuffle(words);
  return ordered.map(w=>{
    const isHeTofr=dir==='he→fr';
    const question=isHeTofr?w.he:w.fr;
    const answer=isHeTofr?w.fr:w.he;
    const pool=words.filter(x=>x!==w&&(isHeTofr?x.fr:x.he)!==answer);
    const wrongItems=shuffle(pool).slice(0,3);
    const wrong=wrongItems.map(x=>isHeTofr?x.fr:x.he);
    const choiceMeanings={};
    choiceMeanings[answer]=isHeTofr?w.fr:w.he;
    wrongItems.forEach(y=>{ choiceMeanings[isHeTofr?y.fr:y.he]=isHeTofr?y.he:y.fr; });
    return{question,answer,choices:shuffle([answer,...wrong]),choiceMeanings,trans:w.trans,isHeTofr,fr:w.fr,he:w.he};
  });
}

function showSetup(){ hide('quiz-screen'); hide('result-screen'); show('setup-screen'); }

function startQuiz(){
  quiz=buildQuiz(allData[currentTab],direction);
  idx=0; score=0; errors=[]; answered=false;
  visited=new Set([0]); showNav=false;
  hide('setup-screen'); hide('result-screen'); show('quiz-screen');
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=quiz[idx];
  const pct=(idx/quiz.length)*100;
  const isHeAns=!q.isHeTofr;
  $('q-counter').textContent=`${idx+1} / ${quiz.length}`;
  $('q-score').textContent=`✓ ${score}`;
  $('prog-fill').style.width=pct+'%';
  $('q-label').textContent=q.isHeTofr?'Que signifie ce mot ?':'Comment dit-on en hébreu ?';
  const qText=$('q-text');
  qText.textContent=q.question;
  qText.className='q-text '+(q.isHeTofr?'he':'fr');
  $('q-spk').onclick=()=>speak(q.question,q.isHeTofr?'he-IL':'fr-FR',$('q-spk'));
  const choicesEl=$('choices');
  choicesEl.innerHTML='';
  q.choices.forEach(c=>{
    const wrap=document.createElement('div');
    wrap.className='choice-wrap';
    if(!q.isHeTofr){
      const spk=document.createElement('button');
      spk.className='choice-spk'; spk.textContent='🔊';
      spk.addEventListener('click',e=>{e.stopPropagation();speak(c,'he-IL');});
      wrap.appendChild(spk);
    }
    const btn=document.createElement('button');
    btn.className='choice'+(isHeAns?' he':'');
    btn.dataset.choice=c;
    btn.innerHTML=`<div>${c}</div>`;
    btn.addEventListener('click',()=>answerQ(c));
    wrap.appendChild(btn);
    choicesEl.appendChild(wrap);
  });
  show('dontknow-btn'); hide('reveal-box'); hide('next-btn'); hide('nav-panel');
  updateNavDots();
}

function updateNavDots(){
  const dots=$('nav-dots');
  dots.innerHTML='';
  quiz.forEach((_,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-dot '+(i===idx?'current':visited.has(i)?'done':'todo');
    btn.textContent=i+1;
    btn.addEventListener('click',()=>{idx=i;visited.add(i);hide('nav-panel');showNav=false;renderQuestion();});
    dots.appendChild(btn);
  });
}

function answerQ(choice){
  if(answered) return;
  answered=true;
  const q=quiz[idx];
  const isCorrect=choice===q.answer;
  if(isCorrect) score++; else errors.push(q);
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.disabled=true;
    const c=btn.dataset.choice;
    if(c===q.answer) btn.classList.add('correct');
    else if(c===choice&&!isCorrect){
      btn.classList.add('wrong');
      if(q.choiceMeanings&&q.choiceMeanings[c]){
        const m=document.createElement('div');
        m.className='choice-meaning';
        m.textContent='= '+q.choiceMeanings[c];
        btn.appendChild(m);
      }
    }
  });
  const isDontKnow=choice==='__dk__';
  $('reveal-label').textContent=isDontKnow?'La réponse était':isCorrect?'✓ Bonne réponse !':'La réponse correcte était';
  const revWord=$('reveal-word');
  revWord.textContent=q.answer;
  revWord.className='reveal-word'+(q.isHeTofr?' fr':' he')+(isCorrect?' correct-color':'');
  if(q.trans){$('reveal-trans').textContent=q.trans;show('reveal-trans');}else hide('reveal-trans');
  $('ans-spk').onclick=()=>speak(q.answer,q.isHeTofr?'fr-FR':'he-IL',$('ans-spk'));
  hide('dontknow-btn'); show('reveal-box');
  const nextBtn=$('next-btn');
  nextBtn.textContent=idx+1>=quiz.length?'Voir les résultats':'Question suivante →';
  show('next-btn');
}

function showResult(){
  hide('quiz-screen'); show('result-screen');

  // Sauvegarder le score dans localStorage
  saveScore(currentTab, score, quiz.length);
  // Rafraîchir les badges des onglets
  buildTabs();
  setActiveTab(currentTab);

  const pct=Math.round((score/quiz.length)*100);
  const color=pct>=80?'var(--green)':pct>=60?'var(--blue)':'var(--red)';
  const emoji=pct>=80?'🎉':pct>=60?'💪':'📚';
  const msg=pct>=80?'Excellent !':pct>=60?'Bon travail !':'Continue à réviser !';

  // Emoji de la catégorie active pour personnaliser le message
  const tabEmoji=TAB_ICONS[currentTab]||'🇮🇱';
  const fullMsg=`${emoji} ${msg} ${tabEmoji}`;

  const ring=$('trophy-ring');
  ring.style.stroke=color;
  setTimeout(()=>{ring.style.strokeDashoffset=283-(pct/100)*283;},100);
  $('trophy-pct').textContent=pct+'%';
  $('trophy-pct').setAttribute('fill',color.replace('var(--green)','#1a7a3a').replace('var(--blue)','#0038b8').replace('var(--red)','#b01a1a'));
  $('trophy-emoji').textContent=emoji;
  $('result-label').textContent=fullMsg;
  $('stat-ok').textContent=score;
  $('stat-err').textContent=quiz.length-score;
  $('stat-tot').textContent=quiz.length;

  const errList=$('errors-list');
  errList.innerHTML='';
  if(errors.length>0){
    $('errors-title').textContent=`Mots à retravailler (${errors.length})`;
    errors.forEach(e=>{
      const div=document.createElement('div');
      div.className='error-item';
      div.innerHTML=`<div class="error-row"><span class="error-fr">${e.fr}</span><span class="error-he">${e.he}</span></div>${e.trans?`<div class="error-trans">${e.trans}</div>`:''}`;
      errList.appendChild(div);
    });
    show('errors-section');
  } else hide('errors-section');
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.pill[data-dir]').forEach(p=>{
  p.addEventListener('click',()=>{
    direction=p.dataset.dir;
    document.querySelectorAll('.pill[data-dir]').forEach(x=>x.classList.toggle('active',x===p));
  });
});
document.querySelectorAll('.pill[data-order]').forEach(p=>{
  p.addEventListener('click',()=>{
    quizOrder=p.dataset.order;
    document.querySelectorAll('.pill[data-order]').forEach(x=>x.classList.toggle('active',x===p));
  });
});
$('start-btn').addEventListener('click',startQuiz);
$('back-btn').addEventListener('click',showSetup);
$('dontknow-btn').addEventListener('click',()=>answerQ('__dk__'));
$('next-btn').addEventListener('click',()=>{
  if(idx+1>=quiz.length) showResult();
  else{idx++;visited.add(idx);renderQuestion();}
});
$('restart-btn').addEventListener('click',startQuiz);
$('back-setup-btn').addEventListener('click',showSetup);
$('prog-wrap').addEventListener('click',()=>{
  showNav=!showNav;
  if(showNav){updateNavDots();show('nav-panel');}else hide('nav-panel');
});

// ── DÉMARRAGE ─────────────────────────────────────────────────────────────────
loadVocabulaire();
</script>
