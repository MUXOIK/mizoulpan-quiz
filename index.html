<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZOULPAN Quiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Heebo, sans-serif; background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #0038B8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab { padding: 10px 20px; border: 2px solid #DDD; background: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { border-color: #0038B8; background: #E3F2FD; color: #0038B8; }
        .tab-count { background: #0038B8; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-left: 5px; }
        .quiz-content { display: none; }
        .quiz-content.active { display: block; }
        .question { font-size: 24px; text-align: center; color: #0038B8; margin: 20px 0; padding: 20px; background: #F5F5F5; border-radius: 10px; }
        .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .choice { padding: 15px; border: 2px solid #DDD; border-radius: 8px; cursor: pointer; font-size: 16px; text-align: center; }
        .choice:hover { border-color: #0038B8; background: #E3F2FD; }
        .choice.correct { border-color: green; background: #E8F5E9; color: green; }
        .choice.wrong { border-color: red; background: #FFEBEE; color: red; }
        .btn { padding: 12px 24px; background: #0038B8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px 5px 0 0; }
        .btn:hover { background: #002D7A; }
        .stats { text-align: center; color: #666; margin-top: 20px; }
        .progress { width: 100%; height: 6px; background: #DDD; border-radius: 3px; margin: 15px 0; }
        .progress-bar { height: 100%; background: #0038B8; border-radius: 3px; transition: width 0.3s; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🇮🇱 MIZOULPAN Quiz</h1>
        <p class="subtitle">Révise ton hébreu</p>
        
        <div id="tabsContainer" class="tabs"></div>
        <div id="quizContainer"></div>
        <div class="stats" id="statsDiv"></div>
    </div>
</div>

<script>
const GITHUB_URL = 'https://raw.githubusercontent.com/MUXOIK/mizoulpan-quiz/main/vocabulaire.xlsx';
let allSheets = {};
let currentTab = 'verbes';
let currentQuizData = [];
let currentIndex = 0;
let score = 0;
let answered = false;

async function init() {
    try {
        const response = await fetch(GITHUB_URL + '?t=' + Date.now());
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        
        // Charger tous les onglets
        const sheets = ['verbes', 'liaison', 'interrogation', 'adjectif', 'vocabulaire', 'vétement', 'transport', 'classroom'];
        
        for (const sheet of sheets) {
            const ws = workbook.Sheets[sheet];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
            
            // Extraire colonne 1 (français) et colonne 2 (hébreu) - IGNORER les formes conjuguées
            const data = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i][0] && rows[i][1]) {
                    data.push({
                        fr: String(rows[i][0]).trim(),
                        he: String(rows[i][1]).trim()
                    });
                }
            }
            
            allSheets[sheet] = data;
        }
        
        renderTabs();
        startQuiz('verbes');
        
    } catch (error) {
        document.getElementById('quizContainer').innerHTML = `<p style="color: red;">Erreur: ${error.message}</p>`;
    }
}

function renderTabs() {
    const html = Object.keys(allSheets).map(sheet => `
        <button class="tab ${sheet === 'verbes' ? 'active' : ''}" onclick="startQuiz('${sheet}')">
            ${sheet.charAt(0).toUpperCase() + sheet.slice(1)}
            <span class="tab-count">${allSheets[sheet].length}</span>
        </button>
    `).join('');
    
    document.getElementById('tabsContainer').innerHTML = html;
}

function startQuiz(sheet) {
    currentTab = sheet;
    currentQuizData = allSheets[sheet];
    currentIndex = 0;
    score = 0;
    answered = false;
    
    // Activer le tab
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.closest('.tab')?.classList.add('active');
    
    displayQuestion();
}

function displayQuestion() {
    if (currentIndex >= currentQuizData.length) {
        showSummary();
        return;
    }
    
    answered = false;
    const q = currentQuizData[currentIndex];
    const choices = [q.he];
    
    // Ajouter 3 mauvaises réponses aléatoires
    while (choices.length < 4) {
        const random = currentQuizData[Math.floor(Math.random() * currentQuizData.length)].he;
        if (!choices.includes(random)) choices.push(random);
    }
    
    choices.sort(() => Math.random() - 0.5);
    
    const html = `
        <div class="progress">
            <div class="progress-bar" style="width: ${(currentIndex / currentQuizData.length) * 100}%"></div>
        </div>
        <p style="text-align: center; color: #666; margin-bottom: 10px;">Question ${currentIndex + 1} / ${currentQuizData.length}</p>
        <div class="question">${q.fr}</div>
        <div class="choices">
            ${choices.map(choice => `
                <div class="choice" onclick="checkAnswer('${choice}', '${q.he}')">${choice}</div>
            `).join('')}
        </div>
        <div id="feedback"></div>
        <div style="text-align: center;">
            <button class="btn" onclick="nextQuestion()" style="display: none;" id="nextBtn">Suivant →</button>
        </div>
        <div class="stats">⭐ Score: ${score} / ${currentIndex}</div>
    `;
    
    document.getElementById('quizContainer').innerHTML = html;
}

function checkAnswer(selected, correct) {
    if (answered) return;
    answered = true;
    
    const choices = document.querySelectorAll('.choice');
    choices.forEach(choice => {
        if (choice.textContent === correct) {
            choice.classList.add('correct');
        } else if (choice.textContent === selected && selected !== correct) {
            choice.classList.add('wrong');
        }
        choice.style.pointerEvents = 'none';
    });
    
    if (selected === correct) {
        score++;
        document.getElementById('feedback').innerHTML = '<p style="color: green; font-weight: bold; text-align: center;">✅ Bonne réponse!</p>';
    } else {
        document.getElementById('feedback').innerHTML = '<p style="color: red; font-weight: bold; text-align: center;">❌ Mauvaise réponse</p>';
    }
    
    document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
    currentIndex++;
    displayQuestion();
}

function showSummary() {
    const pct = Math.round((score / currentQuizData.length) * 100);
    document.getElementById('quizContainer').innerHTML = `
        <div style="text-align: center; padding: 40px;">
            <h2>🎉 Quiz terminé!</h2>
            <p style="font-size: 48px; color: #0038B8; margin: 20px 0;">${score} / ${currentQuizData.length}</p>
            <p style="font-size: 20px; color: #666; margin-bottom: 20px;">${pct}%</p>
            <button class="btn" onclick="startQuiz('${currentTab}')">Recommencer</button>
        </div>
    `;
}

init();
</script>
</body>
</html>
